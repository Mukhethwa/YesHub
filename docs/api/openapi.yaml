  - name: enterprise
    description: "The corporate portal: listings and ESD programmes with their applicants, suppliers, shortlists, team and settings. For members of the caller's organisation."
  - name: opportunities
    description: "Creating and running listings and ESD programmes: drafts, publishing, amending, closing and cancelling. For members of the organisation."
  - name: tenders
