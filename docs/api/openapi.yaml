      operationId: enterprise.overview
      x-convex-function: enterprise:overview
      x-convex-type: query
      description: |-
        Most opportunities shown on the dashboard. */
        const OPPORTUNITY_LIMIT = 100;

        /** The signed-in user's enterprise organisation, or null for SMEs, staff and anyone without one. */
        export async function getEnterprise(ctx: QueryCtx) {
          const user = await authComponent.safeGetAuthUser(ctx);
          if (!user) return null;
          const organization = (await organizationsFor(ctx, user._id)).find((org) => org.kind === "enterprise");
          return organization ? { user, organization } : null;
        }

        async function applicationsFor(ctx: QueryCtx, opportunity: Doc<"opportunities">) {
          return ctx.db
            .query("applications")
            .withIndex("by_opportunity", (q) => q.eq("opportunityId", opportunity._id))
            .take(APPLICATION_LIMIT);
        }

        /** The organisation's members, departments (Better Auth teams) and pending invitations. */
        export async function organizationDetail(ctx: QueryCtx, organizationId: string) {
          const detail = await ctx.runQuery(components.betterAuth.organizations.detail, { organizationId });
          return detail ?? { members: [], teams: [], invitations: [] };
        }

        type OrganizationDetail = Awaited<ReturnType<typeof organizationDetail>>;

        /** The departments the signed-in user belongs to. */
        export function teamIdsOf(detail: OrganizationDetail, userId: string) {
          return detail.members.find((m) => m.userId === userId)?.teamIds ?? [];
        }

        function summarize(
          opportunity: Doc<"opportunities">,
          applications: Doc<"applications">[],
          teamNames: Map<string, string>,
        ) {
          // A department that has since been deleted counts as unassigned
          const teamId = opportunity.teamId && teamNames.has(opportunity.teamId) ? opportunity.teamId : null;
          return {
            id: opportunity._id,
            kind: opportunity.kind,
            title: opportunity.title,
            reference: opportunity.reference,
            industry: opportunity.industry,
            provinces: opportunity.provinces,
            value: opportunity.value ?? null,
            closesAt: opportunity.closesAt,
            status: opportunity.status,
            createdAt: opportunity._creationTime,
            teamId,
            teamName: teamId ? teamNames.get(teamId)! : null,
            // Withdrawn applications are listed, but out of every count
            applications: applications.filter((a) => a.status !== "withdrawn").length,
            qualified: applications.filter((a) => a.status !== "withdrawn" && a.evaluation.qualifies).length,
            shortlisted: applications.filter((a) => a.status === "shortlisted").length,
            /** Awarded, or for an ESD programme, accepted into it. */
            accepted: applications.filter((a) => a.status === "awarded").length,
            /** Applications nobody has shortlisted or declined yet. */
            awaitingReview: applications.filter((a) => a.status === "submitted").length,
          };
        }

